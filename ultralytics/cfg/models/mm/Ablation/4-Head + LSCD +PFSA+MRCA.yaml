# Ultralytics YOLOMM 🚀 
# Proposed Paradigm: Frozen Backbone + PFSA (Deep) + MRCA_IAFusion (Shallow) + LSCD
# 参考 2026 年最新论文《Enhancing RGB-IR object detection...》设计的轻量冻结范式

multimodal:
  Multiple_Input: True

nc: 6 # 🚨注意：DroneVehicle 是 5，M3FD 是 6，跑之前确认一下！
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ========== RGB 路径 (层 0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2: RGB_P2
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4: RGB_P3
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2, [512, True]]            # 6: RGB_P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10: RGB_P5

  # ========== IR 路径 (层 11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11
  - [-1, 1, Conv, [128, 3, 2]]            # 12
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13: IR_P2
  - [-1, 1, Conv, [256, 3, 2]]            # 14
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15: IR_P3
  - [-1, 1, Conv, [512, 3, 2]]            # 16
  - [-1, 2, C3k2, [512, True]]            # 17: IR_P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 18
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21: IR_P5

  # ========== 🏆 2026级 轻量冻结融合层 (层 22-29) ==========
  # 深层 P5 和 P4 引入 PFSA (无参数空间注意力) 
  # 作用：防止深层语义特征退化，以极低算力完美对齐 RGB 和 IR 的高阶特征。
  - [[10, 21], 1, PFSA, []]                   # 22: P5 PFSA
  - [-1, 2, C3k2, [1024, True]]               # 23: P5 Fused

  - [[6, 17], 1, PFSA, []]                    # 24: P4 PFSA
  - [-1, 2, C3k2, [512, True]]                # 25: P4 Fused

  # 浅层 P3 和 P2 引入 MRCA_IAFusion (多感受野光照感知融合)
  # 作用：在底层捕捉 1x1, 3x3, 5x5 的多尺度细节，自适应分配光照权重，兜底极小目标。
  - [[4, 15], 1, MRCA_IAFusion, []]           # 26: P3 MRCA_IAFusion
  - [-1, 2, C3k2, [512, False]]               # 27: P3 Fused

  - [[2, 13], 1, MRCA_IAFusion, []]           # 28: P2 MRCA_IAFusion
  - [-1, 2, C3k2, [256, False]]               # 29: P2 Fused

head:
  # 自顶向下 PAN
  - [23, 1, nn.Upsample, [None, 2, "nearest"]]    # 30
  - [[-1, 25], 1, Concat, [1]]                    # 31 
  - [-1, 2, C3k2, [512, False]]                   # 32 (P4 Neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 33
  - [[-1, 27], 1, Concat, [1]]                    # 34
  - [-1, 2, C3k2, [256, False]]                   # 35 (P3 Neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 36
  - [[-1, 29], 1, Concat, [1]]                    # 37
  - [-1, 2, C3k2, [256, False]]                   # 38 (P2 Small Out)

  # 自底向上 FPN
  - [38, 1, Conv, [256, 3, 2]]                    # 39
  - [[-1, 35], 1, Concat, [1]]                    # 40
  - [-1, 2, C3k2, [256, False]]                   # 41 (P3 Med Out)

  - [-1, 1, Conv, [256, 3, 2]]                    # 42
  - [[-1, 32], 1, Concat, [1]]                    # 43
  - [-1, 2, C3k2, [512, False]]                   # 44 (P4 Large Out)

  - [-1, 1, Conv, [512, 3, 2]]                    # 45
  - [[-1, 23], 1, Concat, [1]]                    # 46
  - [-1, 2, C3k2, [1024, True]]                   # 47 (P5 Huge Out)

  # 四尺度动态检测头 (保持极速轻量)
  - [[38, 41, 44, 47], 1, Detect_LSCD, [nc]]      # 48