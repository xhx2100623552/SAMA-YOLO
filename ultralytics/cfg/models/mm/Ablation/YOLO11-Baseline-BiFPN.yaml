multimodal:
  Multiple_Input: True

nc: 6 # 🚨 注意：M3FD 是 6 个类！(DroneVehicle 是 5 个)
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ========== RGB 路径 (层 0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2: RGB_P2
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4: RGB_P3
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2, [512, True]]            # 6: RGB_P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10: RGB_P5

  # ========== IR 路径 (层 11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11
  - [-1, 1, Conv, [128, 3, 2]]            # 12
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13: IR_P2
  - [-1, 1, Conv, [256, 3, 2]]            # 14
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15: IR_P3
  - [-1, 1, Conv, [512, 3, 2]]            # 16
  - [-1, 2, C3k2, [512, True]]            # 17: IR_P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 18
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21: IR_P5

  # ========== Baseline 基础融合 (层 22-27) ==========
  # 注意：去掉了 P2 融合，因为我们不需要四头了
  - [[10, 21], 1, Concat, [1]]            # 22: P5 Concat
  - [-1, 2, C3k2, [1024, True]]           # 23: P5 Fused

  - [[6, 17], 1, Concat, [1]]             # 24: P4 Concat
  - [-1, 2, C3k2, [512, True]]            # 25: P4 Fused

  - [[4, 15], 1, Concat, [1]]             # 26: P3 Concat
  - [-1, 2, C3k2, [256, False]]           # 27: P3 Fused

head:
  # 自顶向下 PAN (不涉及 P2)
  - [23, 1, nn.Upsample, [None, 2, "nearest"]]    # 28
  - [[-1, 25], 1, BiFPN_Concat, [1]]              # 29 (修改为 BiFPN)
  - [-1, 2, C3k2, [512, False]]                   # 30 (P4 Neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 31
  - [[-1, 27], 1, BiFPN_Concat, [1]]              # 32 (修改为 BiFPN)
  - [-1, 2, C3k2, [256, False]]                   # 33 (P3 Small Out)

  # 自底向上 FPN (从 P3 开始)
  - [33, 1, Conv, [256, 3, 2]]                    # 34
  - [[-1, 30, 25], 1, BiFPN_Concat, [1]]          # 35 🌟 (灵魂三路融合：下采样的P3[-1], P4_Neck[30], 原始主干P4[25])
  - [-1, 2, C3k2, [512, False]]                   # 36 (P4 Med Out)

  - [-1, 1, Conv, [512, 3, 2]]                    # 37
  - [[-1, 23], 1, BiFPN_Concat, [1]]              # 38 (修改为 BiFPN，P5顶层只有两路)
  - [-1, 2, C3k2, [1024, True]]                   # 39 (P5 Large Out)

  # 🎯 基础三尺度检测头 (官方原生 Detect，非共享)
  - [[33, 36, 39], 1, Detect, [nc]]               # 40