# Parameters  完全体+M3FD
nc: 5 # number of classes
scales: # model compound scaling constants
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # ========== RGB路径 (层0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2  (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4  (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6  (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== X路径 (红外) (层11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (X_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (X_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (X_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

 # ========== 多尺度混合融合 (层22-32) ==========
  # P4 融合 + HFP (中大目标：升级为 MCFGatedFusion 门控融合)
  - [[6, 17], 1, MCFGatedFusion, ['add', 3]]  # 22 👈 替换掉暴力的 Concat！
  - [-1, 2, C3k2, [512, True]]                # 23 (修复：输出通道改为标准的 512，防参数爆炸)
  - [-1, 1, HighFrequencyPerception, []]      # 24: Fused_P4_HFP

  # P5 融合 + HFP (大目标：升级为 MCFGatedFusion 门控融合)
  - [[10, 21], 1, MCFGatedFusion, ['add', 3]] # 25 👈 替换掉暴力的 Concat！
  - [-1, 2, C3k2, [1024, True]]               # 26 (P5 保持 1024)
  - [-1, 1, C2PSA, [1024]]                    # 27
  - [-1, 1, HighFrequencyPerception, []]      # 28: Fused_P5_HFP 👈 空括号没毛病！

  # P3 融合 (小目标：保留你极其出色的 IAFusion 光照感知)
  - [[4, 15], 1, IAFusion, []]                # 29: 自适应加权 RGB_P3 和 X_P3
  - [-1, 1, C3k2, [256, False]]               # 30: Fused_P3 👈 (修复：输出通道降为标准的 256)

  # P2 融合 (极小目标：保留你极其出色的 IAFusion 光照感知)
  - [[2, 13], 1, IAFusion, []]                # 31: 自适应加权 RGB_P2 和 X_P2
  - [-1, 1, C3k2, [128, False]]               # 32: Fused_P2 👈 (修复：输出通道降为标准的 128)

head:
  # 自顶向下 FPN
  - [28, 1, nn.Upsample, [None, 2, "nearest"]]  # 33: P5上采样
  - [[-1, 24], 1, Concat, [1]]                  # 34: 接 Fused_P4_HFP
  - [-1, 2, C3k2, [512, False]]                 # 35

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 36: P4上采样
  - [[-1, 30], 1, Concat, [1]]                  # 37: 接 Fused_P3
  - [-1, 2, C3k2, [256, False]]                 # 38: P3特征

  # 额外向下至 P2 (微小目标关键层)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 39: P3上采样
  - [[-1, 32], 1, Concat, [1]]                  # 40: 接 Fused_P2
  - [-1, 2, C3k2, [128, False]]                 # 41: P2特征

  # 自底向上 PAN
  - [41, 1, Conv, [128, 3, 2]]                  # 42: P2下采样
  - [[-1, 38], 1, Concat, [1]]                  # 43
  - [-1, 2, C3k2, [256, False]]                 # 44: 精炼P3

  - [-1, 1, Conv, [256, 3, 2]]                  # 45: P3下采样
  - [[-1, 35], 1, Concat, [1]]                  # 46
  - [-1, 2, C3k2, [512, False]]                 # 47: 精炼P4

  - [-1, 1, Conv, [512, 3, 2]]                  # 48: P4下采样
  - [[-1, 28], 1, Concat, [1]]                  # 49: 注意这里接的是 28 (Fused_P5_HFP)
  - [-1, 2, C3k2, [1024, True]]                 # 50: 精炼P5

  # 四尺度检测头 (专杀无人机极小目标)
  - [[41, 44, 47, 50], 1, Detect, [nc]]         # 51 Detect(P2, P3, P4, P5)
#
