# YOLOv11-RGBT MCF Config for DroneVehicle
# 🎯 核心目标：红外(IR)主导 + 可见光(RGB)受控微调 (MCF) + 5类目标
nc: 5 
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ========== 主分支：IR 路径 (层0-10) [配合训练脚本被冻结] ==========
  - [-1, 1, Conv, [64, 3, 2], 'IR']       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 (IR_P2) 
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 (IR_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 (IR_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (IR_P5) 

  # ========== 辅助分支：RGB 路径 (层11-21) [参与训练更新] ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13 (RGB_P2)
  - [-1, 1, Conv, [256, 3, 2]]            # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15 (RGB_P3)
  - [-1, 1, Conv, [512, 3, 2]]            # 16-P4/16
  - [-1, 2, C3k2, [512, True]]            # 17 (RGB_P4)
  - [-1, 1, Conv, [1024, 3, 2]]           # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (RGB_P5) 

  # ========== 融合层 (MCFG 门控 + IAF 光照感知) ==========
  # 将 RGB(辅助) 的特征通过门控机制注入 IR(主干)，防止可见光噪声污染红外特征
  - [[6, 17], 1, MCFGatedFusion, ['add', 3]]  # 22 (P4 融合)
  - [-1, 2, C3k2, [512, True]]                # 23
  - [-1, 1, HighFrequencyPerception, []]      # 24

  - [[10, 21], 1, MCFGatedFusion, ['add', 3]] # 25 (P5 融合)
  - [-1, 2, C3k2, [1024, True]]               # 26
  - [-1, 1, C2PSA, [1024]]                    # 27
  - [-1, 1, HighFrequencyPerception, []]      # 28

  - [[4, 15], 1, IAFusion, []]                # 29 (P3 融合)
  - [-1, 1, C3k2, [256, False]]               # 30

  - [[2, 13], 1, IAFusion, []]                # 31 (P2 融合)
  - [-1, 1, C3k2, [256, False]]               # 32 (⚠️ 统一输出通道，防止张量拼接崩溃)

head:
  - [28, 1, nn.Upsample, [None, 2, "nearest"]]  # 33
  - [[-1, 24], 1, Concat, [1]]                  # 34
  - [-1, 2, C3k2, [512, False]]                 # 35

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 36
  - [[-1, 30], 1, Concat, [1]]                  # 37
  - [-1, 2, C3k2, [256, False]]                 # 38

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 39
  - [[-1, 32], 1, Concat, [1]]                  # 40
  - [-1, 2, C3k2, [256, False]]                 # 41 (P2 输出，对齐 64 通道)

  - [41, 1, Conv, [256, 3, 2]]                  # 42 (下采样 P2 -> P3)
  - [[-1, 38], 1, Concat, [1]]                  # 43
  - [-1, 2, C3k2, [256, False]]                 # 44

  - [-1, 1, Conv, [256, 3, 2]]                  # 45
  - [[-1, 35], 1, Concat, [1]]                  # 46
  - [-1, 2, C3k2, [512, False]]                 # 47

  - [-1, 1, Conv, [512, 3, 2]]                  # 48
  - [[-1, 28], 1, Concat, [1]]                  # 49
  - [-1, 2, C3k2, [1024, True]]                 # 50

  - [[41, 44, 47, 50], 1, Detect, [nc]]         # 51 Detect(P2, P3, P4, P5)