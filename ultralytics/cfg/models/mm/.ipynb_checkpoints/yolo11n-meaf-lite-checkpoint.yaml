# YOLOv11-RGBT Low-Loss Fusion Config (MEAF Lite)
nc: 11 # VEDAI 为 11 类
scales: 
  n: [0.50, 0.25, 1024]

backbone:
  # ========== RGB Path (0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2: RGB_P2 (64通道)
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4: RGB_P3 (128通道)
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10 (RGB_P5)

  # ========== X Path (Infrared) (11-21) ==========
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 11
  - [-1, 1, Conv, [128, 3, 2]]            # 12
  - [-1, 2, C3k2, [256, False, 0.25]]     # 13: X_P2 (64通道)
  - [-1, 1, Conv, [256, 3, 2]]            # 14
  - [-1, 2, C3k2, [512, False, 0.25]]     # 15: X_P3 (128通道)
  - [-1, 1, Conv, [512, 3, 2]]            # 16
  - [-1, 2, C3k2, [512, True]]            # 17
  - [-1, 1, Conv, [1024, 3, 2]]           # 18
  - [-1, 2, C3k2, [1024, True]]           # 19
  - [-1, 1, SPPF, [1024, 5]]              # 20
  - [-1, 2, C2PSA, [1024]]                # 21 (X_P5)

 # ========== Fusion Layers (22-23) ==========
  # P3 融合 (小目标关键层)：借用 MEAF
  # 🎯 MEAF参数填 c2 (融合后通道数)，由于缩放系数gw=0.25，原版P3是512，缩放后是128。
  - [[4, 15], 1, MEAF, [512]]                 # 22 (Fused_P3, gw缩放后通道对齐128)
  
  # P2 融合 (极小目标关键层)：借用 MEAF
  # 🎯 原版P2是256，缩放gw=0.25后是64。
  - [[2, 13], 1, MEAF, [256]]                 # 23 (Fused_P2, gw缩放后通道对齐64)

# Neck 和 Head 逻辑：直接套用官方原版Head，但注意拼接索引
head:
  # 自顶向下 FPN (从 P5 融合或 RGB_P5 开始)
  # 这里为了防过拟合，深层用最简Concat
  - [[10, 21], 1, Concat, [1]]                # 24: P5 暴力的 Concat 融合 (2048通道)
  - [-1, 2, C3k2, [1024, True]]               # 25: Fused_P5 (1024通道)
  
  - [25, 1, nn.Upsample, [None, 2, "nearest"]]  # 26: P5上采样
  - [[-1, 6, 17], 1, Concat, [1]]             # 27: 接 RGB_P4(6) 和 IR_P4(17) (1024通道)
  - [-1, 2, C3k2, [512, False]]                 # 28: Fused_P4
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 29: P4上采样
  - [[-1, 22], 1, Concat, [1]]                  # 30: 接 MEAF精炼过的Fused_P3(22) (256通道)
  - [-1, 2, C3k2, [256, False]]                 # 31: 精炼 P3

  # 额外向下至 P2 (微小目标专杀)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 32: P3上采样
  - [[-1, 23], 1, Concat, [1]]                  # 33: 接 MEAF精炼过的Fused_P2(23) (128通道)
  - [-1, 2, C3k2, [128, False]]                 # 34: 精炼 P2 (🎯 四尺度检测头 P2,通道数128)

  # PAN 自底向上
  - [34, 1, Conv, [128, 3, 2]]                  # 35: P2下采样
  - [[-1, 31], 1, Concat, [1]]                  # 36
  - [-1, 2, C3k2, [256, False]]                 # 37

  # 四尺度检测头
  - [[34, 37, 28, 25], 1, Detect, [nc]]         # 38 Detect(P2, P3, P4, P5)