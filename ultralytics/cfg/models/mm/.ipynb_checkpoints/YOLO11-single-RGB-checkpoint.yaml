multimodal:
  Multiple_Input: False  # 🚨 必须改为 False，告诉数据流只读单路

nc: 6 # 🚨 记得投 M3FD 时改回 6
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ========== 完全保留 RGB 路径 (层 0-10) ==========
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2: RGB_P2
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4: RGB_P3
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2, [512, True]]            # 6: RGB_P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10: RGB_P5

  # ❌ 删除了原本的 层 11 到 层 21 的 IR 路径 ❌

  # ========== 改写原融合层：由于没有IR，这里直接继承RGB特征 ==========
  # 原层 22-23 (P5)
  - [10, 2, C3k2, [1024, True]]           # 11: 相当于原 P5 Fused，通道不再减半，保持1024

  # 原层 24-25 (P4)
  - [6, 2, C3k2, [512, True]]             # 12: 相当于原 P4 Fused

  # 原层 26-27 (P3)
  - [4, 2, C3k2, [512, False]]            # 13: 相当于原 P3 Fused

  # 原层 28-29 (P2)
  - [2, 2, C3k2, [256, False]]            # 14: 相当于原 P2 Fused

head:
  # ========== 重新计算索引后的自顶向下 PAN ==========
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]    # 15 (对应原30)
  - [[-1, 12], 1, Concat, [1]]                    # 16 (对应原31)
  - [-1, 2, C3k2, [512, False]]                   # 17 (对应原32, P4 Neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 18 (对应原33)
  - [[-1, 13], 1, Concat, [1]]                    # 19 (对应原34)
  - [-1, 2, C3k2, [256, False]]                   # 20 (对应原35, P3 Neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 21 (对应原36)
  - [[-1, 14], 1, Concat, [1]]                    # 22 (对应原37)
  - [-1, 2, C3k2, [256, False]]                   # 23 (对应原38, P2 Small Out)

  # ========== 重新计算索引后的自底向上 FPN (保留 BiFPN_Concat) ==========
  - [23, 1, Conv, [256, 3, 2]]                    # 24 (对应原39)
  - [[-1, 20, 13], 1, BiFPN_Concat, [1]]          # 25 (对应原40: 动态平衡)
  - [-1, 2, C3k2, [256, False]]                   # 26 (对应原41, P3 Med Out)

  - [-1, 1, Conv, [256, 3, 2]]                    # 27 (对应原42)
  - [[-1, 17, 12], 1, BiFPN_Concat, [1]]          # 28 (对应原43: 动态平衡)
  - [-1, 2, C3k2, [512, False]]                   # 29 (对应原44, P4 Large Out)

  - [-1, 1, Conv, [512, 3, 2]]                    # 30 (对应原45)
  - [[-1, 11], 1, BiFPN_Concat, [1]]              # 31 (对应原46: 动态平衡)
  - [-1, 2, C3k2, [1024, True]]                   # 32 (对应原47, P5 Huge Out)

  # ========== 四尺度检测头 ==========
  - [[23, 26, 29, 32], 1, Detect_LSCD, [nc]]      # 33 (对应原48)